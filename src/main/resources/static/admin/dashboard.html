<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>darmoz-auth · Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>darmoz-auth · Panel de administración</h1>
  <div>
    <span id="session-email" style="font-size:0.85rem;color:#4a5069;margin-right:1rem;"></span>
    <button type="button" class="secondary" id="logout-btn">Cerrar sesión</button>
  </div>
</header>

<nav class="tabs">
  <button type="button" class="tab-btn active" data-tab="users">Usuarios</button>
  <button type="button" class="tab-btn" data-tab="roles">Roles</button>
  <button type="button" class="tab-btn" data-tab="permissions">Permisos</button>
</nav>

<main>
  <p class="error" id="global-error"></p>

  <section id="panel-users" class="panel active">
    <table>
      <thead>
        <tr><th>Email</th><th>Estado</th><th>Roles</th><th>Acciones</th></tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
    <div class="form-card">
      <h2>Nuevo usuario</h2>
      <form id="user-form">
        <div class="form-row">
          <div>
            <label for="user-email">Email</label>
            <input type="email" id="user-email" required>
          </div>
          <div>
            <label for="user-password">Password</label>
            <input type="password" id="user-password" minlength="8" required>
          </div>
        </div>
        <label for="user-roles">Roles</label>
        <select id="user-roles" multiple required></select>
        <div class="form-actions">
          <button type="submit">Crear usuario</button>
        </div>
      </form>
    </div>
  </section>

  <section id="panel-roles" class="panel">
    <table>
      <thead>
        <tr><th>Nombre</th><th>Descripción</th><th>Acciones</th></tr>
      </thead>
      <tbody id="roles-table-body"></tbody>
    </table>
    <div class="form-card">
      <h2>Nuevo rol</h2>
      <form id="role-form">
        <div class="form-row">
          <div>
            <label for="role-name">Nombre (MAYUSCULAS)</label>
            <input type="text" id="role-name" pattern="^[A-Z][A-Z0-9_]*$" required>
          </div>
          <div>
            <label for="role-description">Descripción</label>
            <input type="text" id="role-description">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Crear rol</button>
        </div>
      </form>
    </div>
  </section>

  <section id="panel-permissions" class="panel">
    <table>
      <thead>
        <tr><th>Rol</th><th>Servicio</th><th>Método</th><th>Endpoint</th><th>Acciones</th></tr>
      </thead>
      <tbody id="permissions-table-body"></tbody>
    </table>
    <div class="form-card">
      <h2>Nuevo permiso</h2>
      <form id="permission-form">
        <div class="form-row">
          <div>
            <label for="permission-role">Rol</label>
            <select id="permission-role" required></select>
          </div>
          <div>
            <label for="permission-service">Servicio</label>
            <input type="text" id="permission-service" placeholder="nexora-api" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="permission-method">Método HTTP</label>
            <select id="permission-method">
              <option>GET</option>
              <option>POST</option>
              <option>PUT</option>
              <option>PATCH</option>
              <option>DELETE</option>
            </select>
          </div>
          <div>
            <label for="permission-pattern">Endpoint pattern</label>
            <input type="text" id="permission-pattern" placeholder="/api/products/**" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Crear permiso</button>
        </div>
      </form>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
