name: darmoz-auth

services:
  darmoz-auth:
    image: ${DARMOZ_AUTH_IMAGE:-ghcr.io/darmozcs/darmoz-auth:latest}
    container_name: darmoz-auth
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./keys:/app/keys:ro
    ports:
      # Solo LAN, nunca 0.0.0.0: acceso al dashboard admin (/admin/**) que
      # Traefik excluye a proposito (ver regla mas abajo). Igual patron que
      # el acceso administrativo a services/postgres.
      - "192.168.1.23:${DARMOZ_AUTH_LAN_PORT:-8081}:8080"
    networks:
      - proxy
      - data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.darmoz-auth.rule=Host(`${DARMOZ_AUTH_DOMAIN}`) && PathPrefix(`${DARMOZ_AUTH_PATH_PREFIX}`) && !PathPrefix(`${DARMOZ_AUTH_PATH_PREFIX}/admin`)"
      - "traefik.http.routers.darmoz-auth.entrypoints=websecure"
      - "traefik.http.routers.darmoz-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.darmoz-auth.middlewares=secure-headers@file"
      - "traefik.http.services.darmoz-auth.loadbalancer.server.port=${DARMOZ_AUTH_PORT:-8080}"

networks:
  proxy:
    external: true
  data:
    external: true
